<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17365d" />
    <title>AKA Dashboard - Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #f4f6f8;
        color: #17212b;
        font-family: Tahoma, Arial, sans-serif;
      }
      main {
        width: min(430px, 100%);
        padding: 30px;
        text-align: center;
        border: 1px solid #d9e0e8;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 8px 28px rgba(23, 54, 93, 0.08);
      }
      img { width: 86px; height: 86px; border-radius: 20px; }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0; color: #66717e; font-size: 14px; line-height: 1.9; }
      button {
        min-height: 46px;
        margin-top: 22px;
        padding: 0 22px;
        border: 0;
        border-radius: 11px;
        background: #17365d;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/aka-app-icon.svg" alt="AKA" />
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>برای مشاهدهٔ آخرین اطلاعات و انتشار فایل اکسل، اتصال اینترنت لازم است. پس از برقراری اینترنت دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش مجدد</button>
    </main>
  </body>
</html>
