name: Full Source Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-source-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout executive repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone complete source repository
        run: |
          git clone --depth 1 https://github.com/hfardar2-gif/aka2000mt.git /tmp/aka2000mt-source

      - name: Replace repository contents with source tree
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/full-source-migration.yml' \
            /tmp/aka2000mt-source/ ./
          rm -f .github/workflows/full-source-migration.yml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build exact source project
        run: bun run build

      - name: Commit complete source migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes detected.'
            exit 0
          fi
          git commit -m 'Replace Executive repository with complete aka2000mt source tree'
          git push origin main
