name: Connect Executive Overview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/connect-executive-overview.yml"

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch the existing dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/routes/index.tsx")
          text = path.read_text(encoding="utf-8")

          section_import = 'import { Section } from "@/components/dashboard/Section";'
          overview_import = 'import { ExecutiveOverview } from "@/components/dashboard/ExecutiveOverview";'
          if overview_import not in text:
              if section_import not in text:
                  raise SystemExit("Section import was not found")
              text = text.replace(section_import, section_import + "\n" + overview_import, 1)

          old_header = '''            <div>
              <div className="mb-3 inline-flex items-center gap-2 rounded-full border border-primary/30 bg-primary/10 px-3 py-1 text-xs font-medium uppercase tracking-wider text-primary">'''
          new_header = '''            <div>
              <img src="/aka-logo.svg" alt="AKA" className="mb-5 h-16 w-auto rounded-xl bg-white px-3 py-2 shadow-sm print:h-12" />
              <div className="mb-3 inline-flex items-center gap-2 rounded-full border border-primary/30 bg-primary/10 px-3 py-1 text-xs font-medium uppercase tracking-wider text-primary">'''
          if '/aka-logo.svg' not in text:
              if old_header not in text:
                  raise SystemExit("Header anchor was not found")
              text = text.replace(old_header, new_header, 1)

          old_main = '''      <main className="mx-auto flex max-w-7xl flex-col gap-8 px-6 py-10">
        <div className="grid grid-cols-2 gap-4 md:grid-cols-4 xl:grid-cols-7">'''
          new_main = '''      <main className="mx-auto flex max-w-[1440px] flex-col gap-8 px-6 py-10">
        <ExecutiveOverview
          lang={lang}
          totalPlanned={totalPlanned}
          totalActual={totalActual}
          galvanized={totals.galvanized}
          sold={totals.sold}
          readyToShip={report.transport.readyWarehouse}
          tonLabel={tr("ton")}
        />

        <div className="grid grid-cols-2 gap-4 md:grid-cols-4 xl:grid-cols-7">'''
          if '<ExecutiveOverview' not in text:
              if old_main not in text:
                  raise SystemExit("Main dashboard anchor was not found")
              text = text.replace(old_main, new_main, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit direct dashboard changes
        run: |
          rm -f .github/workflows/connect-executive-overview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/connect-executive-overview.yml
          git commit -m "Connect executive overview to the complete dashboard"
          git push origin main
