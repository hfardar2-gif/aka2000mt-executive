name: Apply Executive Visuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-executive-visuals.yml"

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply executive visual layer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/routes/index.tsx")
          text = path.read_text(encoding="utf-8")

          header_anchor = '''            <div>
              <div className="mb-3 inline-flex items-center gap-2 rounded-full border border-primary/30 bg-primary/10 px-3 py-1 text-xs font-medium uppercase tracking-wider text-primary">'''
          header_replacement = '''            <div>
              <img src="/aka-logo.svg" alt="AKA" className="mb-5 h-16 w-auto rounded-xl bg-white px-3 py-2 shadow-sm print:h-12" />
              <div className="mb-3 inline-flex items-center gap-2 rounded-full border border-primary/30 bg-primary/10 px-3 py-1 text-xs font-medium uppercase tracking-wider text-primary">'''

          if "/aka-logo.svg" not in text:
              if header_anchor not in text:
                  raise SystemExit("Header anchor not found")
              text = text.replace(header_anchor, header_replacement, 1)

          main_anchor = '''      <main className="mx-auto flex max-w-7xl flex-col gap-8 px-6 py-10">
        <div className="grid grid-cols-2 gap-4 md:grid-cols-4 xl:grid-cols-7">'''
          main_replacement = '''      <main className="mx-auto flex max-w-[1440px] flex-col gap-8 px-6 py-10">
        <section className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
          <div className="rounded-2xl border border-border bg-card p-5 shadow-[var(--shadow-card)]">
            <p className="text-sm font-medium text-muted-foreground">{lang === "zh" ? "生产计划完成率" : lang === "fa" ? "تحقق برنامهٔ تولید" : "Production plan completion"}</p>
            <p className="mt-4 text-4xl font-semibold tabular-nums text-primary">{achievementPct.toFixed(1)}%</p>
            <p className="mt-2 text-xs text-muted-foreground">{fmt0(totalActual)} / {fmt0(totalPlanned)} {tr("ton")}</p>
          </div>
          <div className="rounded-2xl border border-border bg-card p-5 shadow-[var(--shadow-card)]">
            <p className="text-sm font-medium text-muted-foreground">{tr("galvanized")}</p>
            <p className="mt-4 text-4xl font-semibold tabular-nums text-primary">{fmt0(totals.galvanized)}</p>
            <p className="mt-2 text-xs text-muted-foreground">{tr("ton")}</p>
          </div>
          <div className="rounded-2xl border border-border bg-card p-5 shadow-[var(--shadow-card)]">
            <p className="text-sm font-medium text-muted-foreground">{tr("sold")}</p>
            <p className="mt-4 text-4xl font-semibold tabular-nums text-emerald-500">{fmt0(totals.sold)}</p>
            <p className="mt-2 text-xs text-muted-foreground">{tr("ton")}</p>
          </div>
          <div className="rounded-2xl border border-amber-500/30 bg-amber-500/10 p-5 shadow-[var(--shadow-card)]">
            <p className="text-sm font-medium text-muted-foreground">{tr("readyToShip")}</p>
            <p className="mt-4 text-4xl font-semibold tabular-nums text-amber-500">{fmt0(report.transport.readyWarehouse)}</p>
            <p className="mt-2 text-xs text-muted-foreground">{tr("ton")}</p>
          </div>
        </section>

        <section className="rounded-2xl border border-amber-500/30 bg-amber-500/10 p-5">
          <p className="text-xs font-semibold uppercase tracking-wider text-amber-500">{lang === "zh" ? "核心管理问题" : lang === "fa" ? "مسئلهٔ اصلی مدیریتی" : "Key management issue"}</p>
          <p className="mt-2 text-sm leading-7 text-foreground">{lang === "zh" ? "生产进度明显快于已完成销售，成品库存正在占用仓储容量，并影响剩余生产计划。" : lang === "fa" ? "تولید از فروش قطعی جلوتر است و موجودی محصول نهایی با اشغال ظرفیت انبار، ادامهٔ برنامهٔ تولید را محدود می‌کند." : "Production is ahead of completed sales. Finished-goods inventory is consuming warehouse capacity and constraining the remaining production plan."}</p>
        </section>

        <div className="grid grid-cols-2 gap-4 md:grid-cols-4 xl:grid-cols-7">'''

          if "Key management issue" not in text:
              if main_anchor not in text:
                  raise SystemExit("Main anchor not found")
              text = text.replace(main_anchor, main_replacement, 1)
          else:
              text = text.replace('max-w-7xl flex-col gap-8 px-6 py-10', 'max-w-[1440px] flex-col gap-8 px-6 py-10', 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Commit visual changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          if git diff --cached --quiet; then
            echo "No visual changes were needed."
            exit 0
          fi
          git commit -m "Add executive visual layer while preserving full project"
          git push origin main
